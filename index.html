<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karré Long</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F5F2ED;--card:#FFF;--ink:#231F1C;--ink2:#6B635C;--ink3:#9C948C;
  --line:#E4DED6;--terra:#B0442F;
  --b:#6E9CC4;--v:#6E9E7C;--o:#D2903A;--r:#BC4A32;--n:#9C948C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bone);color:var(--ink);
  -webkit-font-smoothing:antialiased;padding:0 0 60px;}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh;}
.side-nav{background:#EFEBE4;border-right:1px solid var(--line);padding:20px 0 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;}
.side-nav .brand{font-family:'Fraunces',serif;font-size:16px;font-weight:600;
  padding:0 18px 16px;letter-spacing:-.2px;}
.mo{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);
  font-weight:600;padding:13px 18px 6px;cursor:pointer;display:flex;align-items:center;gap:6px;
  user-select:none;}
.mo:hover{color:var(--ink2);}
.mo .car{font-size:9px;width:8px;}
.mo .here{margin-left:auto;width:5px;height:5px;border-radius:50%;background:var(--terra);flex-shrink:0;}
.mo.shut{color:var(--ink3);}
.dl{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;
  font-size:13px;color:var(--ink2);border-left:3px solid transparent;}
.dl:hover{background:#E7E2DA;color:var(--ink);}
.dl.on{background:var(--card);color:var(--ink);font-weight:600;border-left-color:var(--terra);}
.dl .dn{font-family:'Fraunces',serif;font-size:15px;font-weight:600;min-width:20px;}
.dl .dd{font-size:11px;color:var(--ink3);text-transform:capitalize;}
.dl.on .dd{color:var(--ink2);}
.wrap{max-width:1100px;padding:22px 26px;}
.closed{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:44px 26px;text-align:center;color:var(--ink3);font-size:14px;}
.closed b{display:block;font-family:'Fraunces',serif;font-size:20px;color:var(--ink2);margin-bottom:6px;}
@media(max-width:820px){
  .shell{grid-template-columns:1fr;}
  .side-nav{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;
    padding:12px;border-right:none;border-bottom:1px solid var(--line);}
  .side-nav .brand,.mo{display:none;}
  .dl{flex-direction:column;gap:2px;padding:8px 12px;border-left:none;border-radius:7px;
    border:1px solid var(--line);background:var(--card);flex-shrink:0;}
  .dl.on{border-color:var(--terra);}
  .wrap{padding:18px 16px;}
}

/* header */
header.h{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
.day{font-family:'Fraunces',serif;font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1.1;}
.crew{font-size:13px;color:var(--ink2);margin-top:5px;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--v);margin-right:5px;vertical-align:1px;}
.dot.off{background:var(--ink3);}
.crew .abs{text-decoration:line-through;color:var(--ink3);}
.hrs{font-size:12px;color:var(--ink2);text-align:right;}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:15px 17px 14px;}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink3);font-weight:600;}
.kpi .num{font-family:'Fraunces',serif;font-size:31px;font-weight:600;letter-spacing:-.8px;margin-top:7px;line-height:1;}
.kpi .sub{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.4;}
.kpi.accent{background:var(--terra);border-color:var(--terra);}
.kpi.accent .lbl{color:rgba(255,255,255,.72);}
.kpi.accent .num,.kpi.accent .sub{color:#fff;}
.track{height:4px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden;}
.track.on{background:rgba(255,255,255,.28);}
.fill{height:100%;background:var(--v);border-radius:2px;transition:width .3s;}
.fill.w{background:#fff;}

h2.s{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--ink3);
  font-weight:600;margin-bottom:10px;}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap;}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;}
.c{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--n);
  border-radius:9px;display:grid;grid-template-columns:236px 1fr;gap:0 28px;padding:15px 20px;
  align-items:start;transition:opacity .2s;}
.c.done{opacity:.5;}
.c[data-l=b]{border-left-color:var(--b);}
.c[data-l=v]{border-left-color:var(--v);}
.c[data-l=o]{border-left-color:var(--o);}
.c[data-l=r]{border-left-color:var(--r);}
.side{border-right:1px solid var(--line);padding-right:22px;}
.when{font-size:10.5px;font-weight:600;letter-spacing:.5px;color:var(--ink3);}
.nm{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-.25px;margin:3px 0 11px;}
.st{display:flex;justify-content:space-between;align-items:flex-start;font-size:11.5px;
  color:var(--ink3);padding:3px 0;}
.st b{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--ink);
  display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
.st b i{font-family:'Inter',sans-serif;font-style:normal;font-size:10.5px;font-weight:600;margin-top:2px;}
.lv-b b,.lv-b b i{color:#3C6F9B;} .lv-v b,.lv-v b i{color:#3F7350;}
.lv-o b,.lv-o b i{color:#9A6512;} .lv-r b,.lv-r b i{color:#A63B26;}
.lv-n b{color:var(--ink2);font-size:12px;} .lv-n b i{display:none;}
.tx{font-size:13px;line-height:1.5;color:var(--ink2);}
.tx b{color:var(--ink);}
.todo{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:1px;}

/* task */
.t{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.42;
  padding:5px 0;cursor:pointer;user-select:none;}
.t .cb{width:15px;height:15px;border:1.5px solid #C6BEB5;border-radius:4px;flex-shrink:0;
  margin-top:1px;background:#fff;position:relative;transition:all .15s;}
.t input{display:none;}
.t input:checked + .cb{background:var(--v);border-color:var(--v);}
.t input:checked + .cb:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.t input:checked ~ .lab{color:var(--ink3);text-decoration:line-through;}
.t:active .cb{transform:scale(.9);}

/* salon */
.box{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;}
.grp{padding:10px 18px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--ink3);font-weight:600;background:#FBF9F6;}
.row{display:flex;align-items:flex-start;gap:11px;padding:9px 18px;border-bottom:1px solid #F2EDE7;
  cursor:pointer;user-select:none;font-size:13.5px;}
.row:last-child{border-bottom:none;}
.row .hr{font-size:11.5px;color:var(--ink3);width:46px;flex-shrink:0;font-variant-numeric:tabular-nums;margin-top:1px;}
.row .cl{color:var(--ink3);}
.row input{display:none;}
.row input:checked ~ .lab{color:var(--ink3);text-decoration:line-through;}
.row input:checked + .cb{background:var(--v);border-color:var(--v);}
.row input:checked + .cb:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.row .cb{width:15px;height:15px;border:1.5px solid #C6BEB5;border-radius:4px;flex-shrink:0;
  margin-top:1px;background:#fff;position:relative;transition:all .15s;}

/* footer / admin */
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:11.5px;color:var(--ink3);}
.btn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;
  font-family:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer;}
.btn:hover{border-color:var(--ink3);color:var(--ink);}
dialog{border:none;border-radius:12px;padding:0;max-width:560px;width:92%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);}
dialog::backdrop{background:rgba(35,31,28,.45);}
.dlg{padding:22px 24px;}
.dlg h3{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:8px;}
.dlg p{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:12px;}
textarea{width:100%;height:190px;border:1px solid var(--line);border-radius:7px;padding:11px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;resize:vertical;color:var(--ink);}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
.btn.p{background:var(--terra);border-color:var(--terra);color:#fff;}
.msg{font-size:12px;padding:8px 11px;border-radius:6px;margin-top:10px;display:none;}
.msg.ok{background:#E8F1EA;color:#3F7350;display:block;}
.msg.ko{background:#FAE8E4;color:#A63B26;display:block;}
.loading{text-align:center;padding:60px 20px;color:var(--ink3);font-size:13px;}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:34px 32px;max-width:400px;width:100%;text-align:center;
 box-shadow:0 8px 30px rgba(35,31,28,.08);}
.lockbox .mark{font-family:'Fraunces',serif;font-size:26px;font-weight:600;letter-spacing:-.6px;}
.lockbox p{font-size:13px;color:var(--ink2);margin:8px 0 20px;line-height:1.5;}
.lockbox input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
 font-family:inherit;font-size:15px;color:var(--ink);text-align:center;background:var(--bone);}
.lockbox input:focus{outline:none;border-color:var(--terra);background:#fff;}
.lockbox button{width:100%;margin-top:11px;padding:12px;border:none;border-radius:8px;
 background:var(--terra);color:#fff;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
.lockbox button:disabled{opacity:.55;cursor:default;}
.lockerr{font-size:12.5px;color:#A63B26;margin-top:11px;min-height:16px;}

@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .c{grid-template-columns:1fr;gap:14px;}
  .side{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:12px;}
  .day{font-size:25px;}
}
</style>
</head>

<script>

/* ---- source des données et déchiffrement ---- */
const DATA_URL = 'jours.enc';
const KPASS = 'phrase';

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, salt, iter){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}

async function dechiffrer(paquet, pass){
  const key = await deriveKey(pass, b64d(paquet.salt), paquet.iter || 250000);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(paquet.iv)},
    key, b64d(paquet.data));
  return JSON.parse(new TextDecoder().decode(clair));
}

function ecranVerrou(msg){
  document.getElementById('app').innerHTML = `
    <div class="lock"><div class="lockbox">
      <div class="mark">Karré Long</div>
      <p>Saisir la phrase d'accès. Elle n'est demandée qu'une fois sur cet appareil.</p>
      <input type="password" id="pw" autocomplete="current-password" enterkeyhint="go">
      <button id="go">Ouvrir</button>
      <div class="lockerr" id="lockerr">${msg||''}</div>
    </div></div>`;
  const inp=document.getElementById('pw'), btn=document.getElementById('go');
  const submit=async()=>{
    const v=inp.value.trim(); if(!v) return;
    btn.disabled=true; btn.textContent='Ouverture…';
    const ok=await chargerDistant(v);
    if(ok){ store.set(KPASS,v); demarrer(); }
    else { btn.disabled=false; btn.textContent='Ouvrir';
           document.getElementById('lockerr').textContent='Phrase incorrecte.';
           inp.value=''; inp.focus(); }
  };
  btn.onclick=submit;
  inp.onkeydown=e=>{ if(e.key==='Enter') submit(); };
  inp.focus();
}

let PAQUET=null;

async function chargerDistant(pass){
  try{
    if(!PAQUET){
      const r=await fetch(DATA_URL,{cache:'no-store'});
      if(!r.ok) return false;
      PAQUET=await r.json();
    }
    const jours=await dechiffrer(PAQUET, pass);
    jours.forEach(j=>{
      const i=JOURS.findIndex(x=>x.date===j.date);
      if(i>=0) JOURS[i]=j; else JOURS.push(j);
    });
    return true;
  }catch(e){ return false; }
}

/* ---- stockage local : fonctionne sur toute page hébergée ---- */
const store = {
  get(k){ try{ const v=localStorage.getItem('kl:'+k); return v===null?null:{value:v}; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('kl:'+k,v); return true; }catch(e){ return false; } },
  list(prefix){ try{ const out=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
      if(k&&k.startsWith('kl:'+prefix)) out.push(k.slice(3)); } return {keys:out}; }catch(e){ return {keys:[]}; } }
};

let DAY=null, ALL={}, STATE={}, saveTimer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kData=d=>'jour:'+d, kState=d=>'etat:'+d;

async function boot(){
  let distant=false;
  try{
    const r=await fetch(DATA_URL,{cache:'no-store'});
    if(r.ok){ PAQUET=await r.json(); distant=true; }
  }catch(e){}

  if(distant){
    const p=store.get(KPASS);
    if(p && p.value && await chargerDistant(p.value)) { demarrer(); return; }
    ecranVerrou(p && p.value ? 'La phrase enregistrée ne fonctionne plus.' : '');
    return;
  }
  demarrer();
}

function demarrer(){
  JOURS=JOURS.filter(j=>!j.ferme&&j.clients.length);
  JOURS.sort((a,b)=>b.date.localeCompare(a.date));
  for(const j of JOURS){
    const st=store.get(kState(j.date));
    ALL[j.date]=st&&st.value?JSON.parse(st.value):{};
  }
  let cur=JOURS[0].date;
  const r=store.get('jour-courant');
  if(r&&r.value&&JOURS.some(j=>j.date===r.value)) cur=r.value;
  select(cur,true);
}

function select(dt,first){
  DAY=JOURS.find(j=>j.date===dt)||JOURS[0];
  STATE=ALL[DAY.date]||(ALL[DAY.date]={});
  if(!first) store.set('jour-courant',DAY.date);
  renderNav(); render(); window.scrollTo(0,0);
}

const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JSEM=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

function progress(j){
  const st=ALL[j.date]||{};
  let tot=0,done=0;
  j.clients.forEach(c=>c.tasks.forEach((_,i)=>{tot++;if(st['c:'+c.id+':'+i])done++;}));
  (j.quotidien||[]).forEach(q=>{tot++;if(st['q:'+q.id])done++;});
  (j.rappeler||[]).forEach(r=>{tot++;if(st['r:'+r.id])done++;});
  return {tot,done};
}

let CLOSED={}, navInit=false;
function initNav(){
  if(navInit) return; navInit=true;
  const cur=DAY.date.slice(0,7);
  JOURS.forEach(j=>{const k=j.date.slice(0,7); if(k!==cur) CLOSED[k]=true;});
}
function toggleMois(k){ CLOSED[k]=!CLOSED[k]; renderNav(); }

function renderNav(){
  initNav();
  const groups=[];
  for(const j of JOURS){
    const dt=new Date(j.date+'T12:00:00');
    const k=j.date.slice(0,7);
    let g=groups.find(x=>x.k===k);
    if(!g){g={k,lbl:MOIS[dt.getMonth()]+' '+dt.getFullYear(),jours:[]};groups.push(g);}
    g.jours.push({j,dt});
  }
  const curMonth=DAY.date.slice(0,7);
  let html='<div class="brand">Karré Long</div>';
  for(const g of groups){
    const shut=!!CLOSED[g.k];
    const hasCur=g.k===curMonth;
    html+=`<div class="mo ${shut?'shut':''}" onclick="toggleMois('${g.k}')">
      <span class="car">${shut?'▸':'▾'}</span>${g.lbl}
      ${shut&&hasCur?'<span class="here"></span>':''}</div>`;
    if(shut) continue;
    for(const {j,dt} of g.jours){
      html+=`<div class="dl ${j.date===DAY.date?'on':''}" onclick="select('${j.date}')">
        <span class="dn">${dt.getDate()}</span>
        <span class="dd">${JSEM[dt.getDay()]}</span></div>`;
    }
  }
  document.getElementById('nav').innerHTML=html;
}

function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const ok=store.set(kState(DAY.date),JSON.stringify(STATE));
    const w=document.getElementById('warn');
    if(w) w.style.display = ok ? 'none' : 'block';
  },300);
}

function toggle(k,on){ STATE[k]=on; ALL[DAY.date]=STATE; persist(); refreshCounts(); renderNav(); }

function stat(l,v,sub){
  if(v==null) return '';
  return `<div class="st"><span>${l}</span><b>${esc(v)}${sub?`<i>${esc(sub)}</i>`:''}</b></div>`;
}

function taskRow(k,label){
  const on=!!STATE[k];
  return `<label class="t"><input type="checkbox" ${on?'checked':''}
    onchange="toggle('${k}',this.checked)"><span class="cb"></span>
    <span class="lab">${esc(label)}</span></label>`;
}

function render(){
  const d=DAY;
  if(d.ferme||!d.clients.length){
    document.getElementById('app').innerHTML=`
      <header class="h">
        <div><div class="day">${esc(d.titre)}</div>
        <div class="crew">${esc(d.horaires)}</div></div>
      </header>
      <div class="closed"><b>Salon fermé</b>Aucun rendez-vous ce jour. Le salon est ouvert du mardi au samedi.</div>
      <div class="foot"><span></span><span>
        <button class="btn" onclick="dlg.showModal()">Charger une journée</button>
      </span></div>`;
    return;
  }
  const allT=[];
  d.clients.forEach(c=>c.tasks.forEach((_,i)=>allT.push('c:'+c.id+':'+i)));
  (d.quotidien||[]).forEach(q=>allT.push('q:'+q.id));
  (d.rappeler||[]).forEach(r=>allT.push('r:'+r.id));

  const cards=d.clients.map(c=>{
    const keys=c.tasks.map((_,i)=>'c:'+c.id+':'+i);
    const done=keys.every(k=>STATE[k]);
    return `<div class="c ${done?'done':''}" data-l="${c.lvl}" data-cid="${c.id}">
      <div class="side">
        <div class="when">${esc(c.h)} · ${esc(c.qui).toUpperCase()}</div>
        <div class="nm">${esc(c.nom)}</div>
        ${stat('Tickets',c.tickets)}
        ${stat('Ticket moyen',c.moyen)}
        ${stat('Fréquence',c.freq)}
        ${c.derniere
          ? `<div class="st lv-${c.lvl}"><span>Dernière visite</span><b>${esc(c.derniere)}<i>${LVL[c.lvl]}</i></b></div>`
          : `<div class="st lv-n"><span>Dernière visite</span><b>Première visite</b></div>`}
      </div>
      <div>
        <div class="tx">${c.tx}</div>
        <div class="todo">${c.tasks.map((t,i)=>taskRow(keys[i],t)).join('')}</div>
      </div>
    </div>`;}).join('');

  const rows=(arr,pre)=>arr.map(x=>{
    const k=pre+':'+x.id, on=!!STATE[k];
    return `<label class="row"><input type="checkbox" ${on?'checked':''}
      onchange="toggle('${k}',this.checked)"><span class="cb"></span>
      <span class="hr">${esc(x.h||'—')}</span>
      <span class="lab">${esc(x.t)}${x.cl?` <span class="cl">· ${esc(x.cl)}</span>`:''}</span></label>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <header class="h">
      <div>
        <div class="day">${esc(d.titre)}</div>
        <div class="crew">${d.present.map(([n,p])=>
          `<span class="dot ${p?'':'off'}"></span><span class="${p?'':'abs'}">${esc(n)}</span>`).join(' &nbsp; ')}</div>
      </div>
      <div class="hrs">${esc(d.horaires)}</div>
    </header>

    <div class="kpis">
      <div class="kpi">
        <div class="lbl">Clients attendus</div>
        <div class="num">${d.nbSalon + d.nbRuby}</div>
        <div class="sub">${d.nbSalon} au salon · ${d.nbRuby} chez Ruby</div>
      </div>
      <div class="kpi">
        <div class="lbl">CA salon estimé</div>
        <div class="num">${d.caSalon.toLocaleString('fr-CH')}</div>
        <div class="sub">CHF · Ruby ${d.caRuby} CHF compté à part</div>
      </div>
      <div class="kpi accent">
        <div class="lbl">Rendez-vous repris</div>
        <div class="num" id="kRdv">0 / ${d.objectif}</div>
        <div class="sub">objectif du jour</div>
        <div class="track on"><div class="fill w" id="kRdvBar" style="width:0%"></div></div>
      </div>
      <div class="kpi">
        <div class="lbl">Clients à rappeler</div>
        <div class="num" id="kRap">0 / ${(d.rappeler||[]).length}</div>
        <div class="sub">actions entreprises</div>
        <div class="track"><div class="fill" id="kRapBar" style="width:0%"></div></div>
      </div>
    </div>

    <h2 class="s">Les clients du jour, dans l'ordre d'arrivée</h2>
    <div class="legend">
      <span><i class="sw" style="background:var(--b)"></i>En avance</span>
      <span><i class="sw" style="background:var(--v)"></i>Dans les temps</span>
      <span><i class="sw" style="background:var(--o)"></i>En retard</span>
      <span><i class="sw" style="background:var(--r)"></i>Très en retard</span>
      <span style="margin-left:auto;color:var(--ink3)">Niveau calculé sur la régularité propre à chaque client</span>
    </div>
    <div class="cards">${cards}</div>

    <h2 class="s">Salon</h2>
    <div class="box">
      <div class="grp">Quotidien</div>${rows(d.quotidien||[],'q')}
      <div class="grp">Clients à rappeler</div>${rows(d.rappeler||[],'r')}
    </div>

    <div class="foot">
      <span id="kTot"></span>
      <span>
        <button class="btn" onclick="dlg.showModal()">Charger une journée</button>
        <button class="btn" onclick="reset()">Réinitialiser</button>
      </span>
    </div>`;
  refreshCounts();
}

function refreshCounts(){
  const d=DAY;
  let tot=0,done=0,rdv=0,rap=0;
  d.clients.forEach(c=>c.tasks.forEach((t,i)=>{
    tot++;
    const k='c:'+c.id+':'+i;
    if(STATE[k]){ done++; if(/^Reprendre un rdv/i.test(t)) rdv++; }
  }));
  (d.quotidien||[]).forEach(q=>{tot++; if(STATE['q:'+q.id])done++;});
  (d.rappeler||[]).forEach(r=>{tot++; if(STATE['r:'+r.id]){done++;rap++;}});

  const nRap=(d.rappeler||[]).length;
  const set=(id,v)=>{const e=document.getElementById(id); if(e)e.textContent=v;};
  const bar=(id,pct)=>{const e=document.getElementById(id); if(e)e.style.width=pct+'%';};
  set('kRdv',rdv+' / '+d.objectif);
  bar('kRdvBar',Math.min(100,Math.round(rdv/d.objectif*100)));
  set('kRap',rap+' / '+nRap);
  bar('kRapBar',nRap?Math.round(rap/nRap*100):0);
  set('kTot',done+' tâches terminées sur '+tot);

  d.clients.forEach(c=>{
    const el=document.querySelector(`.c[data-cid="${c.id}"]`);
    if(!el) return;
    el.classList.toggle('done',c.tasks.every((_,i)=>STATE['c:'+c.id+':'+i]));
  });
}

async function loadDay(){
  const m=document.getElementById('msg');
  try{
    const d=JSON.parse(document.getElementById('ta').value);
    if(!d.date||!Array.isArray(d.clients)) throw new Error('Il manque "date" ou "clients".');
    store.set(kData(d.date),JSON.stringify(d));
    const i=JOURS.findIndex(x=>x.date===d.date);
    if(i>=0)JOURS[i]=d; else JOURS.push(d);
    JOURS.sort((a,b)=>b.date.localeCompare(a.date));
    if(!ALL[d.date]){
      const st=store.get(kState(d.date));
      ALL[d.date]=st&&st.value?JSON.parse(st.value):{};
    }
    m.className='msg ok'; m.textContent='Journée du '+d.date+' chargée.';
    setTimeout(()=>{dlg.close();m.className='msg';select(d.date);},700);
  }catch(e){
    m.className='msg ko'; m.textContent='Données illisibles : '+e.message;
  }
}

async function reset(){
  if(!confirm('Décocher toutes les tâches de la journée ?')) return;
  STATE={}; ALL[DAY.date]={};
  store.set(kState(DAY.date),'{}');
  renderNav(); render();
}

boot();
</script>
</body>
</html>
